services:
  - type: web
    name: smart-ecomm
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --preload -w 1 --threads 4 -b 0.0.0.0:$PORT --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
